# Checks that need neither the PocketBook SDK nor game data.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (gray mapping, refresh policy, layout, keypad)
        run: make -C tests/unit
      - name: Launcher and icon installer
        run: |
          bash tests/launcher/test-launcher.sh
          bash tests/launcher/test-install-icons.sh
